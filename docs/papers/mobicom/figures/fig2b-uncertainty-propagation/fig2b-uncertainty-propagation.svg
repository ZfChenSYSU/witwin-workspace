<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1000" viewBox="0 0 1880 1000"><title>Fig. 2(b): Geometry uncertainty propagation for RF calibration</title><desc>Front-facing observations and geometry calibration define a fixed, feasible position distribution. Alternative positions at the same time are each evaluated using ray tracing, fixed phone pose, room geometry, body proxy, assembly, and one shared set of static parameters theta. Each prediction is compared with the same training CSI. Losses are averaged over equally weighted accepted samples, then summed over training times with regularization to update theta only. Geometry receives no CSI feedback. Theta is frozen for held-out prediction.</desc><rect width="1880" height="1000" fill="white" /><rect stroke-width="0" id="input-band" x="30" y="40" width="1820" height="190" rx="10" fill="#F0F0F0" stroke="none" /><rect stroke-width="0" id="propagation-band" x="30" y="250" width="1820" height="390" rx="10" fill="#F0F0F0" stroke="none" /><rect stroke-width="0" id="optimization-band" x="30" y="660" width="1820" height="280" rx="10" fill="#F0F0F0" stroke="none" /><rect stroke-width="3.5" id="visual-input" x="60" y="80" width="310" height="120" rx="10" fill="#378CE6" stroke="#000000" /><text id="visual-title" x="215" y="118" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central">Front-facing observations</text><text id="calibration-title" x="215" y="162" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central">&amp; geometry calibration</text><polygon stroke-width="2" stroke-linejoin="miter" id="visual-to-distribution" points="370.0,131.0 420.0,131.0 420.0,121.0 440.0,140.0 420.0,159.0 420.0,149.0 370.0,149.0" fill="#CFF0F1" stroke="#000000" /><rect stroke-width="3.5" id="distribution" x="440" y="80" width="280" height="120" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="distribution-title" x="580" y="106" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Position distribution</text><text id="distribution-symbol" x="580" y="145" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">p<tspan baseline-shift="sub" font-size="70%">t</tspan>(r | vision)</text><text id="distribution-subtitle" x="580" y="180" fill="#000000" font-family="Times New Roman, Times, serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">Mean + calibrated covariance</text><rect stroke-width="3.5" id="fixed-context" x="790" y="80" width="440" height="120" rx="10" fill="#F1E6D4" stroke="#000000" /><text id="context-title" x="1010" y="105" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">Fixed context</text><text id="context-pose" x="1010" y="143" fill="#000000" font-family="Times New Roman, Times, serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central">Phone pose, room geometry,</text><text id="context-assembly" x="1010" y="179" fill="#000000" font-family="Times New Roman, Times, serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central">body proxy &amp; assembly</text><rect stroke-width="3.5" id="training-csi" x="1510" y="80" width="300" height="120" rx="10" fill="#378CE6" stroke="#000000" /><text id="csi-title" x="1660" y="105" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">Training CSI</text><text id="csi-symbol" x="1660" y="143" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">y<tspan baseline-shift="sub" font-size="70%">t</tspan> = φ(s<tspan baseline-shift="sub" font-size="70%">t</tspan>)</text><text id="csi-reuse" x="1660" y="180" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">Same observation for all k</text><polygon stroke-width="2" stroke-linejoin="miter" id="distribution-to-samples" points="590.0,200.0 590.0,265.0 601.0,265.0 580.0,285.0 559.0,265.0 570.0,265.0 570.0,200.0" fill="#CFF0F1" stroke="#000000" /><polygon stroke-width="2" stroke-linejoin="miter" id="context-to-tracer" points="1020.0,200.0 1020.0,265.0 1031.0,265.0 1010.0,285.0 989.0,265.0 1000.0,265.0 1000.0,200.0" fill="#F1E6D4" stroke="#000000" /><polygon stroke-width="2" stroke-linejoin="miter" id="csi-to-losses" points="1670.0,200.0 1670.0,265.0 1681.0,265.0 1660.0,285.0 1639.0,265.0 1650.0,265.0 1650.0,200.0" fill="#378CE6" stroke="#000000" /><text id="first-propagation" x="65" y="280" fill="#DC391D" font-family="Times New Roman, Times, serif" font-size="29" font-weight="700" text-anchor="start" dominant-baseline="central">Geometry → channels</text><text id="alternative-note-1" x="65" y="370" fill="#000000" font-family="Times New Roman, Times, serif" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="central">Alternative body positions</text><text id="alternative-note-2" x="65" y="406" fill="#000000" font-family="Times New Roman, Times, serif" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="central">at the same time t</text><text id="alternative-note-3" x="65" y="477" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="start" dominant-baseline="central">Feasible samples from p<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text id="alternative-note-4" x="65" y="513" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="start" dominant-baseline="central">Reused across θ iterations</text><rect stroke-width="3.5" id="samples-container" x="440" y="285" width="280" height="320" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="samples-title" x="580" y="311" fill="#000000" font-family="Times New Roman, Times, serif" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">Possible geometries</text><rect stroke-width="3.5" id="tracer" x="790" y="285" width="440" height="320" rx="10" fill="#F1E6D4" stroke="#000000" /><text id="tracer-title" x="1010" y="322" fill="#000000" font-family="Times New Roman, Times, serif" font-size="33" font-weight="700" text-anchor="middle" dominant-baseline="central">Per-sample ray tracing</text><text id="tracer-action-1" x="1010" y="382" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="central">Recompute visible paths</text><text id="tracer-action-2" x="1010" y="420" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="central">at each possible position</text><text id="tracer-formula" x="1010" y="481" fill="#000000" font-family="Times New Roman, Times, serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central">f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(k)</tspan>(θ) = φ(F<tspan baseline-shift="sub" font-size="70%">θ</tspan>(q<tspan baseline-shift="sub" font-size="70%">t</tspan>, r<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(k)</tspan>, …))</text><text id="tracer-shared-geometry-1" x="1010" y="543" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">One geometry sample spans</text><text id="tracer-shared-geometry-2" x="1010" y="577" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">all subcarriers &amp; channels</text><text id="predictions-title" x="1380" y="305" fill="#000000" font-family="Times New Roman, Times, serif" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">Predictions</text><rect stroke-width="3.5" id="losses-container" x="1510" y="285" width="300" height="320" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="losses-title" x="1660" y="313" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">Per-sample losses</text><rect stroke-width="2.5" id="sample-0" x="470" y="340" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#000000" /><text id="sample-label-0" x="580" y="370" fill="#000000" font-family="Times New Roman, Times, serif" font-size="34" font-weight="400" text-anchor="middle" dominant-baseline="central">r<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(1)</tspan></text><polygon stroke-width="2" stroke-linejoin="miter" id="sample-to-tracer-0" points="720.0,361.0 770.0,361.0 770.0,351.0 790.0,370.0 770.0,389.0 770.0,379.0 720.0,379.0" fill="#CFF0F1" stroke="#000000" /><polygon stroke-width="2" stroke-linejoin="miter" id="tracer-to-prediction-0" points="1230.0,361.0 1280.0,361.0 1280.0,351.0 1300.0,370.0 1280.0,389.0 1280.0,379.0 1230.0,379.0" fill="#F1E6D4" stroke="#000000" /><rect stroke-width="2.5" id="prediction-0" x="1300" y="340" width="160" height="60" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="prediction-label-0" x="1380" y="370" fill="#000000" font-family="Times New Roman, Times, serif" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(1)</tspan>(θ)</text><polygon stroke-width="2" stroke-linejoin="miter" id="prediction-to-loss-0" points="1460.0,362.0 1493.0,362.0 1493.0,353.0 1510.0,370.0 1493.0,387.0 1493.0,378.0 1460.0,378.0" fill="#CFF0F1" stroke="#000000" /><text id="loss-label-0" x="1660" y="370" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">ℓ(y<tspan baseline-shift="sub" font-size="70%">t</tspan>, f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(1)</tspan>(θ))</text><rect stroke-width="2.5" id="sample-1" x="470" y="435" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#000000" /><text id="sample-label-1" x="580" y="465" fill="#000000" font-family="Times New Roman, Times, serif" font-size="34" font-weight="400" text-anchor="middle" dominant-baseline="central">r<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(2)</tspan></text><polygon stroke-width="2" stroke-linejoin="miter" id="sample-to-tracer-1" points="720.0,456.0 770.0,456.0 770.0,446.0 790.0,465.0 770.0,484.0 770.0,474.0 720.0,474.0" fill="#CFF0F1" stroke="#000000" /><polygon stroke-width="2" stroke-linejoin="miter" id="tracer-to-prediction-1" points="1230.0,456.0 1280.0,456.0 1280.0,446.0 1300.0,465.0 1280.0,484.0 1280.0,474.0 1230.0,474.0" fill="#F1E6D4" stroke="#000000" /><rect stroke-width="2.5" id="prediction-1" x="1300" y="435" width="160" height="60" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="prediction-label-1" x="1380" y="465" fill="#000000" font-family="Times New Roman, Times, serif" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(2)</tspan>(θ)</text><polygon stroke-width="2" stroke-linejoin="miter" id="prediction-to-loss-1" points="1460.0,457.0 1493.0,457.0 1493.0,448.0 1510.0,465.0 1493.0,482.0 1493.0,473.0 1460.0,473.0" fill="#CFF0F1" stroke="#000000" /><text id="loss-label-1" x="1660" y="465" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">ℓ(y<tspan baseline-shift="sub" font-size="70%">t</tspan>, f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(2)</tspan>(θ))</text><rect stroke-width="2.5" id="sample-2" x="470" y="530" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#000000" /><text id="sample-label-2" x="580" y="560" fill="#000000" font-family="Times New Roman, Times, serif" font-size="34" font-weight="400" text-anchor="middle" dominant-baseline="central">r<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(K)</tspan></text><polygon stroke-width="2" stroke-linejoin="miter" id="sample-to-tracer-2" points="720.0,551.0 770.0,551.0 770.0,541.0 790.0,560.0 770.0,579.0 770.0,569.0 720.0,569.0" fill="#CFF0F1" stroke="#000000" /><polygon stroke-width="2" stroke-linejoin="miter" id="tracer-to-prediction-2" points="1230.0,551.0 1280.0,551.0 1280.0,541.0 1300.0,560.0 1280.0,579.0 1280.0,569.0 1230.0,569.0" fill="#F1E6D4" stroke="#000000" /><rect stroke-width="2.5" id="prediction-2" x="1300" y="530" width="160" height="60" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="prediction-label-2" x="1380" y="560" fill="#000000" font-family="Times New Roman, Times, serif" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(K)</tspan>(θ)</text><polygon stroke-width="2" stroke-linejoin="miter" id="prediction-to-loss-2" points="1460.0,552.0 1493.0,552.0 1493.0,543.0 1510.0,560.0 1493.0,577.0 1493.0,568.0 1460.0,568.0" fill="#CFF0F1" stroke="#000000" /><text id="loss-label-2" x="1660" y="560" fill="#000000" font-family="Times New Roman, Times, serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">ℓ(y<tspan baseline-shift="sub" font-size="70%">t</tspan>, f<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(K)</tspan>(θ))</text><text id="sample-ellipsis" x="580" y="514" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central">⋮</text><text id="prediction-ellipsis" x="1380" y="514" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central">⋮</text><text id="loss-ellipsis" x="1660" y="514" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central">⋮</text><text id="second-propagation" x="65" y="701" fill="#DC391D" font-family="Times New Roman, Times, serif" font-size="31" font-weight="700" text-anchor="start" dominant-baseline="central">Channels → calibration loss</text><text id="loss-order-note" x="65" y="755" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="700" text-anchor="start" dominant-baseline="central">Compute losses first, then average.</text><text id="geometry-boundary-note" x="65" y="803" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" text-anchor="start" dominant-baseline="central">CSI updates θ only; geometry stays fixed.</text><text id="heldout-note" x="65" y="850" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" text-anchor="start" dominant-baseline="central">Freeze θ for held-out prediction.</text><text id="sampling-note" x="65" y="897" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="start" dominant-baseline="central">K geometry samples ≠ K independent measurements.</text><polygon stroke-width="2" stroke-linejoin="miter" id="losses-to-expectation" points="1672.0,605.0 1672.0,677.0 1684.0,677.0 1660.0,700.0 1636.0,677.0 1648.0,677.0 1648.0,605.0" fill="#66B82F" stroke="#000000" /><rect stroke-width="3.5" id="expected-loss" x="1300" y="700" width="510" height="90" rx="10" fill="#66B82F" stroke="#000000" /><text id="expected-loss-title" x="1555" y="727" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="central">Expected loss at time t</text><text id="expected-loss-formula" x="1555" y="767" fill="#FFFFFF" font-family="Times New Roman, Times, serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">L<tspan baseline-shift="sub" font-size="70%">t</tspan>(θ) ≈ (1/K) Σ<tspan baseline-shift="sub" font-size="70%">k=1…K</tspan> ℓ<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="super" font-size="70%">(k)</tspan>(θ)</text><polygon stroke-width="2" stroke-linejoin="miter" id="expectation-to-update" points="1563.5,790.0 1563.5,808.0 1572.0,808.0 1555.0,825.0 1538.0,808.0 1546.5,808.0 1546.5,790.0" fill="#66B82F" stroke="#000000" /><rect stroke-width="3.5" id="parameter-update" x="1300" y="825" width="510" height="90" rx="10" fill="#CFF0F1" stroke="#000000" /><text id="update-title" x="1555" y="850" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Aggregate training times &amp; update θ</text><text id="update-objective" x="1555" y="890" fill="#000000" font-family="Times New Roman, Times, serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="central">min<tspan baseline-shift="sub" font-size="70%">θ∈Θ</tspan>  Σ<tspan baseline-shift="sub" font-size="70%">t∈train</tspan> L<tspan baseline-shift="sub" font-size="70%">t</tspan>(θ) + λR(θ)</text><polygon stroke-width="2" stroke-linejoin="miter" id="update-to-shared-theta" points="1300.0,880.0 1250.0,880.0 1250.0,890.0 1230.0,870.0 1250.0,850.0 1250.0,860.0 1300.0,860.0" fill="#F1E6D4" stroke="#000000" /><rect stroke-width="3.5" id="shared-theta" x="790" y="825" width="440" height="90" rx="10" fill="#F1E6D4" stroke="#000000" /><text id="shared-theta-title" x="1010" y="854" fill="#000000" font-family="Times New Roman, Times, serif" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">Shared static parameters θ</text><text id="shared-theta-note" x="1010" y="889" fill="#000000" font-family="Times New Roman, Times, serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">One parameter set for all samples</text><polygon stroke-width="2" stroke-linejoin="miter" id="theta-to-tracer" points="998.0,825.0 998.0,629.0 986.0,629.0 1010.0,605.0 1034.0,629.0 1022.0,629.0 1022.0,825.0" fill="#F1E6D4" stroke="#000000" /><text id="feedback-label" x="1120" y="748" fill="#000000" font-family="Times New Roman, Times, serif" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="central">θ feedback</text><text id="figure-caption" x="940" y="972" fill="#000000" font-family="Times New Roman, Times, serif" font-size="35" font-weight="700" text-anchor="middle" dominant-baseline="central">Fig. 2(b): Geometry uncertainty propagation for RF calibration</text></svg>